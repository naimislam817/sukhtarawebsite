<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer symmetrical geometric star / mandala -->
  <g fill="none" stroke="#1B3C35" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Star 1 -->
    <polygon points="50,5 63,37 95,50 63,63 50,95 37,63 5,50 37,37" />
    <!-- Rotated Star 2 -->
    <polygon points="50,15 75,25 85,50 75,75 50,85 25,75 15,50 25,25" />
    <!-- Concentric Inner Octagon -->
    <polygon points="50,28 66,34 72,50 66,66 50,72 34,66 28,50 34,34" />
    <!-- Center Jewel star -->
    <polygon fill="#C8956C" stroke="none" points="50,40 53,47 60,50 53,53 50,60 47,53 40,50 47,47" />
    <!-- Connecting geometric lattice lines -->
    <line x1="50" y1="5" x2="50" y2="95" />
    <line x1="5" y1="50" x2="95" y2="50" />
    <line x1="18" y1="18" x2="82" y2="82" />
    <line x1="18" y1="82" x2="82" y2="18" />
  </g>
</svg>
